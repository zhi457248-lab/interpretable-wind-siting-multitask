name: Build PDF

on:
  push:
    branches: [main]
    paths:
      - 'paper/**/*.tex'
      - 'paper/**/*.bib'
      - '.github/workflows/build-pdf.yml'
  pull_request:
    branches: [main]
    paths:
      - 'paper/**/*.tex'
      - 'paper/**/*.bib'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX Live
        uses: xu-cheng/texlive-action@v2
        with:
          packages: |
            texlive-latex-base
            texlive-latex-extra
            texlive-latex-recommended
            texlive-fonts-recommended
            texlive-science
            texlive-publishers
            latexmk

      - name: Compile paper
        working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error paper_revised.tex
          pdflatex -interaction=nonstopmode -halt-on-error paper_revised.tex
          pdflatex -interaction=nonstopmode -halt-on-error paper_revised.tex

      - name: Verify build
        working-directory: paper
        run: |
          test -s paper_revised.pdf
          echo "PDF size: $(stat -c %s paper_revised.pdf) bytes"
          pdfinfo paper_revised.pdf | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-revised-pdf
          path: paper/paper_revised.pdf
          if-no-files-found: error

      - name: Commit rebuilt PDF
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp paper/paper_revised.pdf paper_revised.pdf
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add paper_revised.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "ci: rebuild PDF"
            git push
          fi