name: wind-siting
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch>=2.0
  - pytorch-cuda=11.8
  - numpy=1.24
  - pandas=1.5
  - scipy=1.10
  - scikit-learn=1.3
  - xgboost=1.7
  - lightgbm=4.0
  - shap=0.42
  - transformers=4.30
  - tokenizers=0.13
  - matplotlib=3.7
  - seaborn=0.12
  - rasterio=1.3
  - xarray=2023.1
  - geopandas=0.13
  - shapely=2.0
  - statsmodels=0.14
  - jupyterlab=4.0
  - pip
  - pip:
      - peft>=0.4
      - sentencepiece>=0.1.99
      - contextily>=1.4